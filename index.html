<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jastip Setiabudi → Cilejit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f7f9f8; --card:#fff; --accent:#2f8f4a; --muted:#6b6b6b;
}
* {box-sizing:border-box;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial}
body {margin:0;background:var(--bg);color:#111}
header {padding:16px;text-align:center;background:var(--card);border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
h1 {margin:0;font-size:18px}
.badge {background:#e6f4ea;color:var(--accent);font-weight:600;font-size:13px;padding:3px 10px;border-radius:20px;display:inline-block;margin-top:6px}
.filters {display:flex;gap:8px;padding:10px 16px;overflow-x:auto}
.chip {background:#fff;border:1px solid #dcdcdc;padding:6px 14px;border-radius:20px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.active {background:var(--accent);color:#fff;border-color:var(--accent)}
.grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:16px}
.card {background:var(--card);border-radius:12px;padding:12px;box-shadow:0 2px 5px rgba(0,0,0,0.05);display:flex;flex-direction:column;justify-content:space-between}
.card img {width:100%;border-radius:10px;height:130px;object-fit:cover}
.card h3 {margin:8px 0 4px;font-size:15px}
.card p {margin:0;font-size:13px;color:var(--muted)}
.price {font-weight:700;margin-top:4px}
.btnrow {display:flex;gap:6px;margin-top:8px}
.btn {flex:1;padding:8px 10px;border-radius:8px;border:0;font-weight:600;cursor:pointer}
.btn.add {background:#fff;border:1px solid #cfe9c9;color:var(--accent)}
.btn.quick {background:var(--accent);color:#fff}
.cartbar {position:fixed;left:12px;right:12px;bottom:12px;background:linear-gradient(90deg,#fff,#f8fff9);padding:10px;border-radius:12px;border:1px solid #e6efe6;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(16,40,12,0.08)}
.cart-info {flex:1}
.cart-summary {font-size:13px;color:var(--muted)}
.cart-total {font-weight:700;font-size:16px}
.detail-order {
  position:fixed;bottom:0;left:0;right:0;background:#fff;
  border-radius:16px 16px 0 0;box-shadow:0 -5px 20px rgba(0,0,0,0.15);
  transform:translateY(100%);transition:transform .3s ease;
  max-height:80vh;overflow-y:auto;padding:16px;
}
.detail-order.active {transform:translateY(0)}
.detail-header {display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.detail-header h2 {margin:0;font-size:16px;}
.detail-close {background:none;border:none;font-size:20px;cursor:pointer;}
.order-item {display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}
.order-name {font-size:14px}
.order-qty {display:flex;align-items:center;gap:6px}
.qty-btn {width:24px;height:24px;text-align:center;line-height:24px;background:#f0f0f0;border-radius:50%;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>💼 Jastip Setiabudi → Cilejit</h1>
  <div class="badge">Order sebelum 16:00 dikirim malam hari 🚆</div>
</header>

<div class="filters" id="filterContainer">
  <div class="chip active" data-cat="Semua">Semua</div>
</div>

<section class="grid" id="products">Memuat data...</section>

<div class="cartbar" id="cartbar" style="display:none">
  <div class="cart-info">
    <div class="cart-summary" id="cart-count">0 item</div>
    <div class="cart-total" id="cart-total">Rp0</div>
  </div>
  <button class="btn quick" id="detailOrderBtn">Lihat Order</button>
</div>

<div class="detail-order" id="detailOrder">
  <div class="detail-header">
    <h2>Detail Order</h2>
    <button class="detail-close" id="closeDetail">✖</button>
  </div>
  <div id="orderList"></div>
</div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/1kc3sz6SwfZuxVQartjwif3npX85CiaMRcr_tPWRFD80/export?format=csv";

let products = [];
let cart = {};
let categories = new Set();

function formatRp(n){return 'Rp'+n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");}

async function loadData() {
  const res = await fetch(SHEET_URL);
  const csv = await res.text();
  const rows = csv.split("\n").slice(1);
  products = rows.map((r,i)=>{
    const [nama,harga,img,kategori,promo] = r.split(",");
    return { id:i+1, nama, harga:+harga, img, kategori:kategori||"Lainnya", promo:promo?.trim()||"Tidak" };
  });
  products.forEach(p=>categories.add(p.kategori));
  renderFilters();
  renderProducts(products);
}

function renderFilters(){
  const container=document.getElementById("filterContainer");
  categories.forEach(cat=>{
    const chip=document.createElement("div");
    chip.className="chip";
    chip.textContent=cat;
    chip.dataset.cat=cat;
    chip.onclick=()=>filterByCategory(cat);
    container.appendChild(chip);
  });
}

function filterByCategory(cat){
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
  document.querySelector(`.chip[data-cat="${cat}"]`).classList.add("active");
  renderProducts(cat==="Semua"?products:products.filter(p=>p.kategori===cat));
}

function renderProducts(list){
  const grid=document.getElementById("products");
  grid.innerHTML="";
  list.forEach(p=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <img src="${p.img}">
      <h3>${p.nama}</h3>
      <p>${p.kategori} ${p.promo=="Ya"?"• Promo":""}</p>
      <div class="price">${formatRp(p.harga)}</div>
      <div class="btnrow">
        <button class="btn add" onclick="addToCart(${p.id})">Titip</button>
        <button class="btn quick">Beli Cepat</button>
      </div>`;
    grid.appendChild(div);
  });
}

function addToCart(id){
  if(!cart[id])cart[id]={...products.find(p=>p.id==id),qty:0};
  cart[id].qty++;
  updateCart();
}

function updateCart(){
  const items=Object.values(cart);
  const totalQty=items.reduce((a,b)=>a+b.qty,0);
  const totalPrice=items.reduce((a,b)=>a+b.harga*b.qty,0);
  document.getElementById("cartbar").style.display = totalQty>0?"flex":"none";
  document.getElementById("cart-count").textContent=`${totalQty} item`;
  document.getElementById("cart-total").textContent=formatRp(totalPrice);
}

function showDetail(){
  const detail=document.getElementById("detailOrder");
  detail.classList.add("active");
  const list=document.getElementById("orderList");
  list.innerHTML="";
  Object.values(cart).forEach(item=>{
    const div=document.createElement("div");
    div.className="order-item";
    div.innerHTML=`
      <div class="order-name">${item.nama}</div>
      <div class="order-qty">
        <div class="qty-btn" onclick="changeQty(${item.id},-1)">−</div>
        <div>${item.qty}</div>
        <div class="qty-btn" onclick="changeQty(${item.id},1)">+</div>
      </div>`;
    list.appendChild(div);
  });
}

function changeQty(id,delta){
  cart[id].qty+=delta;
  if(cart[id].qty<=0) delete cart[id];
  updateCart();
  showDetail();
}

document.getElementById("detailOrderBtn").onclick=showDetail;
document.getElementById("closeDetail").onclick=()=>document.getElementById("detailOrder").classList.remove("active");

loadData();
</script>
</body>
</html>
