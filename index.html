<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toko Online Instan</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #ffffff;
      --text: #111827;
    }
    [data-theme="dark"] {
      --primary: #818cf8;
      --bg: #0f0f10;
      --text: #e5e5e5;
    }
    body {
      font-family: Inter, sans-serif;
      margin:0;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding:16px;
      font-size:20px;
      font-weight:600;
      background:var(--primary);
      color:white;
      text-align:center;
    }
    .container { padding:16px; }
    .product-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
      gap:16px;
    }
    .product {
      background:rgba(0,0,0,0.04);
      border-radius:14px;
      padding:10px;
      cursor:pointer;
      transition:0.2s;
    }
    .product:hover { transform:scale(1.02); }
    .product img {
      width:100%; border-radius:12px;
    }
    .product-title { font-size:14px; margin-top:6px; }
    .product-price { font-size:15px; font-weight:600; color:var(--primary); }

    /* Modal */
    .modal-backdrop {
      position:fixed; inset:0;
      background:rgba(0,0,0,0.65);
      display:none; justify-content:center; align-items:center;
      padding:20px;
    }
    .modal {
      background:var(--bg);
      color:var(--text);
      padding:20px;
      width:100%; max-width:430px;
      border-radius:20px;
    }
    .cart-btn {
      position:fixed;
      bottom:20px; right:20px;
      background:var(--primary);
      color:white;
      padding:14px 18px;
      border-radius:50px;
      font-weight:600;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <header id="shopName">Toko Online</header>

  <div class="container">
    <div class="product-grid" id="productList"></div>
  </div>

  <div class="cart-btn" onclick="openCart()">Keranjang</div>

  <!-- MODAL DETAIL PRODUK -->
  <div id="modalProduct" class="modal-backdrop">
    <div class="modal" id="modalContent"></div>
  </div>

  <!-- CART MODAL -->
  <div id="modalCart" class="modal-backdrop">
    <div class="modal" id="cartContent"></div>
  </div>

  <script>
    let cart = []; // keranjang sederhana

    // Load data dari Google Sheet CSV (ganti link)
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/xxxxxxxx/export?format=csv";

    async function loadProducts() {
      const res = await fetch(SHEET_URL);
      const text = await res.text();
      const rows = text.split("\n").map(r => r.split(","));

      const headers = rows.shift();
      const data = rows.map(r => Object.fromEntries(r.map((v,i)=>[headers[i], v])));

      renderProducts(list){
      const box = document.getElementById("productList");
      box.innerHTML = list.map(p => `
        <div class="product" onclick='openDetail(${JSON.stringify(p)})'>
          <img src="${p.img}">
          <div class="product-title">${p.nama}</div>
          <div class="product-price">Rp ${p.price}</div>
        </div>`
      ).join("");
    }(data);
    }

    function renderProducts(list){
      const box = document.getElementById("productList");
      box.innerHTML = list.map(p => `
        <div class="product" onclick='openDetail(p){
      document.getElementById("modalProduct").style.display="flex";
      document.getElementById("modalContent").innerHTML = `
        <img src="${p.img}" style="width:100%;border-radius:14px;">
        <h2>${p.nama}</h2>
        <p><b>Kategori:</b> ${p.category || '-'}<br>
        <b>Promo:</b> ${p.promo || '-'}</p>
        <h3 style="color:var(--primary)">Rp ${p.price}</h3>
        <button style='padding:12px 16px;background:var(--primary);color:white;border-radius:10px;width:100%;margin-top:10px;font-weight:600' onclick='addToCart(${JSON.stringify(p)})'>Tambahkan ke Keranjang</button>
        <br><br>
        <button onclick='closeDetail()' style='padding:10px;width:100%;margin-top:6px;border-radius:10px;'>Tutup</button>`;
    }(${JSON.stringify(p)})'>
          <img src="${p.gambar}">
          <div class="product-title">${p.nama}</div>
          <div class="product-price">Rp ${p.harga}</div>
        </div>`
      ).join("");
    }

    function openDetail(p){
      document.getElementById("modalProduct").style.display="flex";
      document.getElementById("modalContent").innerHTML = `
        <img src="${p.gambar}" style="width:100%;border-radius:14px;">
        <h2>${p.nama}</h2>
        <p>${p.deskripsi}</p>
        <h3 style="color:var(--primary)">Rp ${p.harga}</h3>
        <button style='padding:12px 16px;background:var(--primary);color:white;border-radius:10px;width:100%;margin-top:10px;font-weight:600' onclick='addToCart(${JSON.stringify(p)})'>Tambahkan ke Keranjang</button>
        <br><br>
        <button onclick='closeDetail()' style='padding:10px;width:100%;margin-top:6px;border-radius:10px;'>Tutup</button>`;
    }
    function closeDetail(){ document.getElementById("modalProduct").style.display="none"; }

    function addToCart(p){
      cart.push(p);
      alert("Ditambahkan ke keranjang");
    }

    function openCart(){
      document.getElementById("modalCart").style.display="flex";
      let html = `<h2>Keranjang</h2>`;
      cart.forEach((item,i)=>{
        html += `<div style='margin:10px 0;border-bottom:1px solid #ccc;padding-bottom:8px;'>${item.nama} - Rp ${item.harga}</div>`;
      });
      html += `<button onclick='closeCart()' style='padding:12px;width:100%;margin-top:10px;border-radius:10px;'>Tutup</button>`;
      document.getElementById("cartContent").innerHTML = html;
    }
    function closeCart(){ document.getElementById("modalCart").style.display="none"; }

    // Dark mode toggle (opsional)
    function toggleTheme(){
      const cur = document.body.getAttribute("data-theme");
      document.body.setAttribute("data-theme", cur=="dark"?"light":"dark");
    }

    loadProducts();
  </script>
</body>
</html>
