<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jastip Thailand → Jakarta</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f7f9f8;--card:#fff;--accent:#2f8f4a;--muted:#6b6b6b;--danger:#d9534f;
    }
    *{box-sizing:border-box;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial}
    body{margin:0;background:var(--bg);color:#111}
    header{background:linear-gradient(90deg,#fff 0%, #f0fff5 100%);padding:14px 16px;border-bottom:1px solid #e6efe6;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
    .logo{width:44px;height:44px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
    .title{font-size:15px;font-weight:600}
    .subtitle{font-size:12px;color:var(--muted)}
    main{padding:14px}
    .hero{background:var(--card);padding:12px;border-radius:12px;box-shadow:0 6px 18px rgba(47,143,74,0.06);display:flex;gap:12px;align-items:center}
    .hero h1{margin:0;font-size:16px}
    .hero p{margin:6px 0 0;color:var(--muted);font-size:13px}
    .badge{background:var(--accent);color:#fff;padding:6px 8px;border-radius:8px;font-size:13px}
    .filters{display:flex;gap:8px;margin:12px 0}
    .chip{background:#fff;padding:8px 12px;border-radius:999px;border:1px solid #e8efe8;font-size:13px;cursor:pointer}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
    .card{background:var(--card);padding:10px;border-radius:12px;border:1px solid #eef6ee}
    .img{height:100px;background:linear-gradient(135deg,#f3f9f3,#fff);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .img img{width:100%;height:100%;object-fit:cover;border-radius:8px}
    .name{font-size:13px;margin:8px 0 4px;font-weight:600}
    .shop{font-size:12px;color:var(--muted)}
    .price{font-weight:700;margin-top:6px}
    .cta{display:flex;gap:8px;margin-top:8px}
    .btn{flex:1;padding:8px 10px;border-radius:8px;border:0;font-weight:600;cursor:pointer}
    .btn.add{background:#fff;border:1px solid #cfe9c9;color:var(--accent)}
    .btn.quick{background:var(--accent);color:#fff}
    .carticon{position:fixed;bottom:16px;right:16px;background:var(--accent);color:#fff;border:none;width:54px;height:54px;border-radius:50%;font-size:22px;box-shadow:0 6px 16px rgba(47,143,74,0.3);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:50}
    .cartcount{position:absolute;top:4px;right:6px;background:#ff5a5a;color:#fff;font-size:12px;padding:2px 6px;border-radius:10px;display:none}
    .cartdrawer{position:fixed;bottom:-100%;left:0;right:0;background:#fff;border-top-left-radius:16px;border-top-right-radius:16px;box-shadow:0 -6px 20px rgba(0,0,0,0.2);padding:16px;transition:bottom 0.3s ease;z-index:100}
    .cartdrawer.active{bottom:0}
    .cart-item{display:flex;justify-content:space-between;align-items:center;margin:8px 0;padding-bottom:6px;border-bottom:1px solid #eee}
    .cart-controls button{background:#eef6ee;border:none;border-radius:6px;padding:4px 8px;margin:0 3px;cursor:pointer}
    .checkout{background:var(--accent);color:#fff;border:0;padding:10px;width:100%;border-radius:10px;font-weight:600;margin-top:12px}
  </style>
</head>
<body>
  <header>
    <div class="logo">JS</div>
    <div>
      <div class="title">💼 JASTIP Thailand → Jakarta</div>
      <div class="subtitle">Skincare & Bodycare — Fee Rp10.000/item</div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="info">
        <h1>Butuh skincare dari Thailand hari ini?</h1>
        <p>Order sebelum <strong>20 September</strong>, saya belanja Hari ini dan sampai jakarta 25 September.</p>
      </div>
      <div class="badge">Open • Hari ini</div>
    </section>

    <div class="filters">
      <div class="chip" onclick="filterCategory('')">Semua</div>
      <div id="categoryContainer"></div>
    </div>

    <section class="grid" id="products"></section>
  </main>

  <button class="carticon" onclick="toggleCart()">
    🛒<span id="cartcount" class="cartcount">0</span>
  </button>

  <div id="cartdrawer" class="cartdrawer">
    <h3>🛍️ Pesanan Kamu</h3>
    <div id="cartitems"></div>
    <div id="carttotal" style="margin-top:8px;font-weight:700"></div>
    <button class="checkout" onclick="checkout()">Kirim via WhatsApp</button>
  </div>

  <script>
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/1kc3sz6SwfZuxVQartjwif3npX85CiaMRcr_tPWRFD80/export?format=csv";
    let PRODUCTS = [];
    let currentCategory = '';
    let cart = JSON.parse(localStorage.getItem("jastip_cart") || "{}");

    const productsEl = document.getElementById('products');
    const cartDrawer = document.getElementById('cartdrawer');
    const cartCount = document.getElementById('cartcount');

    function formatRp(v){return 'Rp'+v.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');}

    fetch(SHEET_URL)
      .then(res => res.text())
      .then(csv => {
        const rows = csv.split("\n").slice(1);
        PRODUCTS = rows.map(r=>{
          const [name,shop,price,img,fee,category,promo] = r.split(",");
          return {id:crypto.randomUUID(),name,shop,price:+price,img,fee:+fee,category,promo:promo?.trim().toLowerCase()==='ya'};
        }).filter(p=>p.name);
        populateCategories();
        renderProducts();
      });

    function populateCategories(){
      const cats = [...new Set(PRODUCTS.map(p=>p.category))].filter(Boolean);
      const container = document.getElementById('categoryContainer');
      container.innerHTML = '';
      cats.forEach(c=>{
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.textContent = c;
        chip.onclick = ()=>filterCategory(c);
        container.appendChild(chip);
      });
    }

    function filterCategory(cat){ currentCategory = cat; renderProducts(); }

    function renderProducts(){
      productsEl.innerHTML = '';
      PRODUCTS.filter(p=>!currentCategory || p.category===currentCategory)
      .forEach(p=>{
        const div = document.createElement('div');
        div.className='card';
        const promoTag = p.promo ? `<div class='promo' style="background:#f00;color:#fff;font-size:11px;padding:2px 6px;border-radius:6px;display:inline-block;margin-bottom:4px">Promo</div>` : '';
        div.innerHTML = `
          ${promoTag}
          <div class="img">${p.img ? `<img src="${p.img}">` : p.shop}</div>
          <div class="name">${p.name}</div>
          <div class="shop">${p.shop}</div>
          <div class="price">${formatRp(p.price)} + Jastip ${formatRp(p.fee)}</div>
          <div class="cta">
            <button class="btn add" onclick='addToCart("${p.id}")'>+ Titip</button>
            <button class="btn quick" onclick='quickOrder("${p.id}")'>Beli Cepat</button>
          </div>
        `;
        productsEl.appendChild(div);
      });
      updateCartCount();
    }

    function addToCart(id){
      const p = PRODUCTS.find(x=>x.id===id);
      if(!p) return;
      if(!cart[id]) cart[id] = {...p, qty:0};
      cart[id].qty++;
      saveCart(); updateCartCount();
    }

    function quickOrder(id){
      addToCart(id);
      openCart();
    }

    function saveCart(){
      localStorage.setItem("jastip_cart", JSON.stringify(cart));
    }

    function updateCartCount(){
      const totalQty = Object.values(cart).reduce((a,b)=>a+b.qty,0);
      cartCount.textContent = totalQty;
      cartCount.style.display = totalQty>0 ? 'inline-block' : 'none';
    }

    function toggleCart(){
      cartDrawer.classList.toggle('active');
      renderCart();
    }

    function openCart(){ cartDrawer.classList.add('active'); renderCart(); }

    function renderCart(){
      const list = document.getElementById('cartitems');
      const totalDiv = document.getElementById('carttotal');
      list.innerHTML = '';
      let total = 0;
      const items = Object.values(cart);
      if(items.length===0){
        list.innerHTML = '<p>Keranjang kosong.</p>';
        totalDiv.textContent = '';
        setTimeout(()=>cartDrawer.classList.remove('active'),300);
        return;
      }
      items.forEach(i=>{
        const subtotal=(i.price+i.fee)*i.qty;
        total+=subtotal;
        list.innerHTML+=`
          <div class="cart-item">
            <div class="cart-item-name">${i.name}<br><small>${formatRp(i.price)} + Fee ${formatRp(i.fee)}</small></div>
            <div class="cart-controls">
              <button onclick="changeQty('${i.id}',-1)">-</button>
              <span>${i.qty}</span>
              <button onclick="changeQty('${i.id}',1)">+</button>
              <button onclick="removeItem('${i.id}')">❌</button>
            </div>
          </div>`;
      });
      totalDiv.textContent='Total: '+formatRp(total);
    }

    function changeQty(id,delta){
      if(!cart[id]) return;
      cart[id].qty += delta;
      if(cart[id].qty <= 0) delete cart[id];
      saveCart(); renderCart(); updateCartCount();
    }

    function removeItem(id){
      delete cart[id];
      saveCart(); renderCart(); updateCartCount();
    }

    function checkout(){
      const items = Object.values(cart);
      if(items.length===0) return alert('Keranjang kosong!');
      let msg='Halo, saya mau titip:\n';
      let total=0;
      items.forEach(i=>{
        const subtotal=(i.price+i.fee)*i.qty;
        total+=subtotal;
        msg+=`- ${i.name} (${i.qty}x ${formatRp(i.price+i.fee)})\n`;
      });
      msg+=`\nTotal: ${formatRp(total)}\n`;
      window.open(`https://wa.me/6281234567890?text=${encodeURIComponent(msg)}`,'_blank');
    }
  </script>
</body>
</html>
