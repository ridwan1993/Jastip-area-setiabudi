<!-- Full final code with tagline input integrated -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dynamic Storefront</title>
<style>
:root {
  --accent: #4f46e5;
  --bg: #f3f4f6;
  --card: #ffffff;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: #111;
}
header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px;
  background: var(--card);
  border-bottom: 1px solid #e5e7eb;
}
.logo {
  width: 48px;
  height: 48px;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 20px;
}
.title {
  font-size: 20px;
  font-weight: bold;
}
.info {
  padding: 20px;
}
.info h1 {
  margin-top: 0;
}
button.settings-btn {
  position: fixed;
  right: 20px;
  bottom: 20px;
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  cursor: pointer;
}
#settingsModal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
}
#settingsBox {
  background: #fff;
  width: 90%;
  max-width: 480px;
  padding: 20px;
  border-radius: 12px;
}
#settingsBox label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
}
#settingsBox input {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  border-radius: 6px;
  border: 1px solid #ccc;
}
#settingsBox button {
  margin-top: 20px;
  width: 100%;
  padding: 12px;
  border: none;
  background: var(--accent);
  color: #fff;
  border-radius: 8px;
  cursor: pointer;
}

/* Responsive Modal Settings */
@media (max-width: 600px) {
  .modal-content {
    width: 90% !important;
    max-height: 90vh !important;
    padding: 15px !important;
  }
  .modal-content input,
  .modal-content textarea,
  .modal-content button {
    font-size: 14px !important;
  }
  .modal-content h2 {
    font-size: 18px !important;
  }
}
</style>
</head>
<body>
<header>
  <div class="logo">JS</div>
  <div class="title">Nama Usaha</div>
</header>

<div class="info">
  <h1>Butuh skincare dari Setiabudi hari ini?</h1>
  <p>Deskripsi usaha akan tampil di sini.</p>
</div>

<button class="settings-btn" onclick="openSettings()">Settings</button>

<!-- SETTINGS MODAL -->
<div id="settingsModal" onclick="closeModal(event)">
  <div id="settingsBox" onclick="event.stopPropagation()">
    <h2>Pengaturan Website</h2>

    <label>Nama Usaha</label>
    <input id="namaInput" placeholder="Contoh: Farma Jaya" />

    <label>Deskripsi Usaha</label>
    <input id="descInput" placeholder="Contoh: Toko skincare & kosmetik" />

    <label>Tagline Website</label>
    <input id="taglineInput" placeholder="Contoh: Butuh skincare dari Setiabudi hari ini?" />

    <label>Nomor WhatsApp</label>
    <input id="waInput" placeholder="6281234567890" />

    <label>Google Sheet URL</label>
    <input id="sheetInput" placeholder="https://docs.google.com/..." />

    <label>Logo (URL gambar)</label>
    <input id="logoInput" placeholder="https://.../logo.png" />

    <label>Warna Tema</label>
    <input id="colorInput" type="color" />

    <button onclick="saveSettings()">Simpan</button>
  </div>
</div>

<script>
function openSettings(){
  document.getElementById("settingsModal").style.display = "flex";
  loadSettings();
}
function closeModal(e){
  if(e.target.id === "settingsModal"){
    document.getElementById("settingsModal").style.display = "none";
  }
}

function saveSettings(){
  const settings = {
    businessName: document.getElementById("namaInput").value,
    description: document.getElementById("descInput").value,
    tagline: document.getElementById("taglineInput").value,
    wa: document.getElementById("waInput").value,
    sheet: document.getElementById("sheetInput").value,
    logo: document.getElementById("logoInput").value,
    color: document.getElementById("colorInput").value
  };

  localStorage.setItem("settings", JSON.stringify(settings));
  applySettings();
  document.getElementById("settingsModal").style.display = "none";
}

function loadSettings(){
  const settings = JSON.parse(localStorage.getItem("settings") || "{}");

  if(settings.businessName) document.getElementById("namaInput").value = settings.businessName;
  if(settings.description) document.getElementById("descInput").value = settings.description;
  if(settings.tagline) document.getElementById("taglineInput").value = settings.tagline;
  if(settings.wa) document.getElementById("waInput").value = settings.wa;
  if(settings.sheet) document.getElementById("sheetInput").value = settings.sheet;
  if(settings.logo) document.getElementById("logoInput").value = settings.logo;
  if(settings.color) document.getElementById("colorInput").value = settings.color;
}

function applySettings(){
  const settings = JSON.parse(localStorage.getItem("settings") || "{}");

  if(settings.businessName)
    document.querySelector(".title").textContent = settings.businessName;

  if(settings.description)
    document.querySelector(".info p").innerHTML = settings.description;

  if(settings.tagline)
    document.querySelector(".info h1").textContent = settings.tagline;

  if(settings.logo)
    document.querySelector(".logo").innerHTML = `<img src="${settings.logo}" style="width:100%;height:100%;border-radius:8px;object-fit:cover;">`;

  if(settings.color)
    document.documentElement.style.setProperty('--accent', settings.color);
}

applySettings();
</script>
</body>
</html>
